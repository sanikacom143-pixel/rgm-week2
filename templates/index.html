<!DOCTYPE html>
<html>
<head>
<title>RGM Week2 - Pixel</title>
<style>
body { font-family: Arial; background: #f0f0f0; text-align: center; padding: 50px; }
.box { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
input { margin: 15px; padding: 10px; }
button { background: #6c5ce7; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
button:hover { background: #5a4bd1; }
</style>
</head>
<body>
<div class="box">
<h2>📸 Pixel - RGM Week 2</h2>
<p>Upload Image to Process</p>
<form action="/"upload" method="post" enctype="multipart/form-data">
<input type="file" name="file" accept="image/*" required><br>
<button type="submit">Upload & Process</button>
</form>
</div>
</body>
</html>
